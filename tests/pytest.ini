[pytest]
# pytest 配置文件
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    -v

markers =
    core: 核心功能测试
    isolation: 用户隔离测试
    audit: 审计功能测试
    conflict: 矛盾消解测试
    integration: 集成测试
    slow: 运行较慢的测试

# 忽略警告
filterwarnings =
    ignore::DeprecationWarning