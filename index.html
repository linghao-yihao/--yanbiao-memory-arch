<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>延标核心系统 — 四层架构</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#0a0e14; --surface:#121822; --surface2:#1a2332; --border:#25324a;
  --text:#e6edf3; --text-dim:#8b949e; --accent:#58a6ff; --accent2:#3fb950;
  --warn:#d29922; --danger:#f85149; --purple:#bc8cff; --cyan:#79c0ff;
  --l0:#f8e8a0; --l1:#58a6ff; --l2:#3fb950; --l3:#bc8cff;
}
body {
  font-family:'Noto Sans CJK SC','WenQuanYi Micro Hei',-apple-system,sans-serif;
  background:var(--bg); color:var(--text); height:100vh; overflow:hidden; font-size:14px;
}
.app { display:grid; grid-template-columns:44% 56%; height:100vh; }

/* ====== 左侧：对话区 ====== */
.chat-panel { display:flex; flex-direction:column; border-right:1px solid var(--border); }
.chat-header { padding:10px 16px; background:var(--surface); border-bottom:1px solid var(--border); }
.chat-header h1 { font-size:15px; font-weight:600; }
.chat-header .sub { font-size:11px; color:var(--text-dim); margin-top:2px; }

.protocols-bar { display:flex; gap:6px; padding:6px 12px; background:var(--surface2); border-bottom:1px solid var(--border); flex-wrap:wrap; }
.protocol-chip { font-size:10px; padding:2px 8px; border-radius:10px; background:rgba(248,232,160,.1); color:var(--l0); border:1px solid rgba(248,232,160,.3); }

.chat-messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:14px; }
.msg { max-width:95%; padding:10px 14px; border-radius:8px; line-height:1.6; word-break:break-word; }
.msg.user { align-self:flex-end; background:var(--surface2); border:1px solid var(--border); }
.msg.ai { align-self:flex-start; background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent); }
.msg.ai.sandbox { border-left-color:var(--purple); }
.msg.ai.pif { border-left-color:var(--danger); }
.msg.ai.semantic { border-left-color:var(--warn); }
.msg .role-tag { font-size:11px; color:var(--text-dim); margin-bottom:4px; }
.msg .time { font-size:10px; color:var(--text-dim); float:right; }

/* 处理流水线 */
.pipeline { font-size:11px; margin-bottom:8px; }
.pipe-stage { display:flex; align-items:center; gap:4px; padding:2px 0; }
.pipe-stage .stage-name { color:var(--text-dim); min-width:80px; }
.pipe-stage .stage-result { color:var(--text); }
.pipe-stage .icon { font-size:10px; }
.pipe-stage.pass .icon { color:var(--accent2); }
.pipe-stage.fail .icon { color:var(--danger); }
.pipe-stage.warn .icon { color:var(--warn); }

/* 延标输出 */
.yb-output { font-size:12px; }
.yb-section { margin:6px 0; }
.yb-title { font-weight:600; font-size:11px; margin-bottom:3px; }
.yb-known { padding:3px 6px; background:rgba(88,166,255,.06); border-radius:3px; margin:3px 0; }
.yb-cite { display:inline-block; background:var(--accent); color:#0a0e14; padding:1px 5px; border-radius:2px; font-size:10px; font-weight:600; margin-right:3px; }
.yb-unknown { padding:3px 6px; background:rgba(188,140,255,.06); border-radius:3px; margin:3px 0; }
.yb-var { color:var(--purple); font-weight:600; }
.yb-suspend { padding:6px; background:rgba(210,153,34,.06); border-radius:4px; border-left:2px solid var(--warn); margin-top:6px; font-size:11px; }
.yb-decision { padding:6px; background:rgba(88,166,255,.06); border-radius:4px; margin-top:6px; font-size:11px; }
.yb-decision li { list-style:none; padding:1px 0; }

/* 沙盒免责声明 */
.sandbox-disclaimer { margin-top:8px; padding:6px; background:rgba(188,140,255,.1); border:1px dashed var(--purple); border-radius:4px; font-size:10px; color:var(--purple); }

/* 输入区 */
.chat-input { padding:10px; border-top:1px solid var(--border); background:var(--surface); }
.chat-input textarea { width:100%; min-height:44px; max-height:120px; padding:8px 12px; background:var(--bg); border:1px solid var(--border); border-radius:6px; color:var(--text); font-size:13px; resize:none; font-family:inherit; }
.chat-input textarea:focus { outline:none; border-color:var(--accent); }
.chat-input .actions { display:flex; gap:8px; margin-top:6px; align-items:center; }
.chat-input .actions button { padding:5px 14px; border:none; border-radius:4px; cursor:pointer; font-size:12px; font-weight:600; }
.btn-send { background:var(--accent); color:#0a0e14; }
.btn-send:disabled { opacity:.4; }
.quick-prompts { display:flex; gap:5px; flex-wrap:wrap; margin-top:5px; }
.quick-prompts button { padding:2px 7px; font-size:10px; background:var(--surface2); border:1px solid var(--border); color:var(--text-dim); border-radius:3px; cursor:pointer; }
.quick-prompts button:hover { color:var(--accent); border-color:var(--accent); }

/* ====== 右侧：系统面板 ====== */
.sys-panel { display:flex; flex-direction:column; background:var(--bg); }
.sys-header { padding:8px 16px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.sys-header h2 { font-size:13px; font-weight:600; }
.sys-header .badge { font-size:10px; color:var(--text-dim); }

.tabs { display:flex; border-bottom:1px solid var(--border); background:var(--surface); }
.tab { padding:7px 14px; cursor:pointer; font-size:11px; color:var(--text-dim); border-bottom:2px solid transparent; transition:all .2s; }
.tab.active { color:var(--accent); border-bottom-color:var(--accent); }
.tab:hover { color:var(--text); }
.tab .count { font-size:9px; background:var(--surface2); padding:0 4px; border-radius:6px; margin-left:3px; }
.tab.l0 { color:var(--l0); }
.tab.l1 { color:var(--l1); }
.tab.l2 { color:var(--l2); }
.tab.l3 { color:var(--l3); }

.tab-content { flex:1; overflow-y:auto; padding:10px; }

/* 层级标识 */
.layer-badge { display:inline-block; padding:1px 6px; font-size:9px; border-radius:3px; font-weight:600; }
.layer-badge.l0 { background:rgba(248,232,160,.15); color:var(--l0); }
.layer-badge.l1 { background:rgba(88,166,255,.15); color:var(--l1); }
.layer-badge.l2 { background:rgba(63,185,80,.15); color:var(--l2); }
.layer-badge.l3 { background:rgba(188,140,255,.15); color:var(--l3); }

/* 卡片 */
.item-card { background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:8px; margin-bottom:6px; }
.item-card:hover { border-color:var(--accent); }
.item-card .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
.item-card .id { font-size:10px; color:var(--accent); font-weight:600; }
.item-card .meta { font-size:9px; color:var(--text-dim); }
.item-card .content { font-size:11px; line-height:1.5; }
.tag { display:inline-block; padding:1px 5px; font-size:9px; border-radius:2px; margin-right:3px; background:var(--surface2); color:var(--text-dim); }
.tag.verified { background:rgba(63,185,80,.15); color:var(--accent2); }
.tag.unverified { background:rgba(210,153,34,.15); color:var(--warn); }
.tag.session { background:rgba(88,166,255,.15); color:var(--accent); }
.tag.universal { background:rgba(63,185,80,.15); color:var(--accent2); }
.tag.worldview { background:rgba(248,232,160,.15); color:var(--l0); }
.tag.sandbox { background:rgba(188,140,255,.15); color:var(--l3); }

.weight-bar { height:3px; background:var(--border); border-radius:2px; margin-top:4px; overflow:hidden; }
.weight-fill { height:100%; border-radius:2px; transition:width .3s; }

.conflict-card { border-left:3px solid var(--warn); }
.conflict-card.resolved { border-left-color:var(--accent2); opacity:.6; }

.empty-state { text-align:center; padding:30px; color:var(--text-dim); font-size:12px; }

::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--text-dim); }

.loading { display:inline-block; width:12px; height:12px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .6s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

.toast { position:fixed; top:12px; right:12px; padding:8px 14px; border-radius:6px; background:var(--surface); border:1px solid var(--border); font-size:11px; z-index:1000; opacity:0; transform:translateX(80px); transition:all .3s; }
.toast.show { opacity:1; transform:translateX(0); }
.toast.success { border-color:var(--accent2); color:var(--accent2); }
.toast.error { border-color:var(--danger); color:var(--danger); }

.control-bar { padding:6px 10px; border-top:1px solid var(--border); background:var(--surface); display:flex; gap:6px; }
.control-bar button { padding:3px 8px; font-size:10px; border:1px solid var(--border); border-radius:3px; background:var(--surface2); color:var(--text-dim); cursor:pointer; }
.control-bar button:hover { color:var(--accent); border-color:var(--accent); }

/* 协议展示 */
.protocol-card { background:var(--surface); border:1px solid rgba(248,232,160,.3); border-radius:6px; padding:10px; margin-bottom:6px; }
.protocol-card .pstmt { font-size:14px; font-weight:700; color:var(--l0); margin-bottom:4px; }
.protocol-card .pmeaning { font-size:11px; color:var(--text-dim); margin-bottom:4px; }
.protocol-card .prule { font-size:10px; color:var(--text); padding:4px 6px; background:rgba(248,232,160,.05); border-radius:3px; }
</style>
</head>
<body>
<div class="app">
  <!-- ====== 左侧：对话面板 ====== -->
  <div class="chat-panel">
    <div class="chat-header">
      <h1>延标核心系统</h1>
      <div class="sub">Layer 0 协议 · Layer 1 事实 · Layer 2 信念 · Layer 3 沙盒</div>
    </div>
    <div class="protocols-bar" id="protocolsBar">
      <span class="protocol-chip">我知道我在</span>
      <span class="protocol-chip">允许一切发生</span>
      <span class="protocol-chip">我是我-病是病</span>
      <span class="protocol-chip">不完美才是完美</span>
      <span class="protocol-chip">事实独裁</span>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input">
      <textarea id="inputBox" placeholder="输入你想说的话或问题..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
      <div class="actions">
        <button class="btn-send" id="sendBtn" onclick="send()">发送</button>
        <div class="quick-prompts">
          <button onclick="quickFill('苹果可食用')">客观事实</button>
          <button onclick="quickFill('苹果是世界上最好吃的水果')">主观观点</button>
          <button onclick="quickFill('男性都喜欢运动')">PIF测试</button>
          <button onclick="quickFill('写一个不用嘴吃饭的小说')">沙盒推演</button>
          <button onclick="quickFill('那个东西有点问题')">模糊语义</button>
          <button onclick="quickFill('我认为事实独裁是我的立场')">信念注册</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ====== 右侧：系统面板 ====== -->
  <div class="sys-panel">
    <div class="sys-header">
      <h2>系统状态</h2>
      <span class="badge" id="sysBadge">加载中</span>
    </div>
    <div style="padding:4px 10px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px">
      <span style="font-size:10px;color:var(--text-dim);white-space:nowrap">认知张力</span>
      <div style="flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden">
        <div id="tensionBar" style="height:100%;width:0%;background:var(--accent2);border-radius:2px;transition:width .5s"></div>
      </div>
    </div>
    <div class="tabs">
      <div class="tab l0 active" data-tab="protocols" onclick="switchTab('protocols')">协议</div>
      <div class="tab l1" data-tab="facts" onclick="switchTab('facts')">事实<span class="count" id="cF">0</span></div>
      <div class="tab l2" data-tab="beliefs" onclick="switchTab('beliefs')">信念<span class="count" id="cB">0</span></div>
      <div class="tab l3" data-tab="sandbox" onclick="switchTab('sandbox')">沙盒<span class="count" id="cS">0</span></div>
      <div class="tab" data-tab="conflicts" onclick="switchTab('conflicts')">矛盾<span class="count" id="cC">0</span></div>
      <div class="tab" data-tab="curiosity" onclick="switchTab('curiosity')">好奇心<span class="count" id="cCur">0</span></div>
      <div class="tab" data-tab="awareness" onclick="switchTab('awareness')">自省</div>
    </div>
    <div class="tab-content" id="tabContent"></div>
    <div class="control-bar">
      <button onclick="loadAll()">刷新</button>
      <button onclick="switchUser()">切换用户</button>
    </div>
  </div>
</div>

<script>
let currentTab = 'protocols';
let currentUserId = 'default';

// ====== 对话 ======

function quickFill(text) {
  document.getElementById('inputBox').value = text;
  document.getElementById('inputBox').focus();
}

function switchUser() {
  const newId = prompt('输入用户ID:', currentUserId);
  if (newId && newId !== currentUserId) {
    currentUserId = newId;
    showToast(`已切换到用户: ${newId}`, 'success');
    loadAll();
  }
}

async function send() {
  const input = document.getElementById('inputBox').value.trim();
  if (!input) return;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('sendBtn').textContent = '处理中...';

  addMessage('user', input);

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ input, user_id: currentUserId }),
    });
    const data = await res.json();
    renderAIResponse(data);
  } catch (e) {
    addMessage('ai', '请求失败: ' + e.message);
  }

  document.getElementById('inputBox').value = '';
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('sendBtn').textContent = '发送';
  loadAll();
}

function addMessage(role, text, subtype) {
  const msg = document.createElement('div');
  msg.className = `msg ${role}` + (subtype ? ` ${subtype}` : '');
  const t = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  if (role === 'user') {
    msg.innerHTML = `<div class="role-tag">用户 (${currentUserId})</div>${escapeHtml(text)}<span class="time">${t}</span>`;
  } else {
    msg.innerHTML = `<div class="role-tag">系统</div>${text}<span class="time">${t}</span>`;
  }
  const c = document.getElementById('chatMessages');
  c.appendChild(msg);
  c.scrollTop = c.scrollHeight;
}

function renderAIResponse(data) {
  let html = '';
  let subtype = '';

  // 处理流水线
  if (data.stages && data.stages.length) {
    html += '<div class="pipeline">';
    for (const stage of data.stages) {
      const passed = stage.result && (stage.result.passed !== false);
      const cls = passed === false ? 'fail' : (stage.result && stage.result.issues && stage.result.issues.length ? 'warn' : 'pass');
      const icon = cls === 'pass' ? '✓' : (cls === 'fail' ? '✗' : '⚠');
      let detail = '';
      if (stage.result) {
        if (stage.result.clarity) detail = stage.result.clarity;
        else if (stage.result.triggered !== undefined) detail = stage.result.triggered ? '触发' : '通过';
        else if (stage.result.passed !== undefined) detail = stage.result.passed ? '通过' : '偏离';
        else if (stage.result.type) detail = stage.result.type;
        else if (stage.result.conflict_id) detail = '已记录';
        else detail = '完成';
      }
      html += `<div class="pipe-stage ${cls}"><span class="icon">${icon}</span><span class="stage-name">${stage.name}</span><span class="stage-result">${detail}</span></div>`;
    }
    html += '</div>';
  }

  // 判定子类型
  if (data.in_sandbox) subtype = 'sandbox';
  else if (data.stages && data.stages.some(s => s.stage === 'pif_check' && s.result.triggered)) subtype = 'pif';
  else if (data.needs_user_input) subtype = 'semantic';

  // 输出文本
  if (data.output_text) {
    html += `<div class="yb-output">${formatOutput(data.output_text, data)}</div>`;
  }

  // 决策链
  if (data.decision_chain && data.decision_chain.length) {
    html += '<div class="yb-decision"><div style="font-weight:600;font-size:11px;margin-bottom:3px">决策链</div><ul>';
    for (const step of data.decision_chain) {
      html += `<li>→ ${escapeHtml(step)}</li>`;
    }
    html += '</ul></div>';
  }

  // 沙盒免责
  if (data.in_sandbox) {
    html += '<div class="sandbox-disclaimer">⚠ 为沙盒推演，已架空现实，不可现实使用</div>';
  }

  // 好奇心状态
  if (data.system_tension && data.system_tension.total_gap > 0) {
    const st = data.system_tension;
    const stColor = st.tension_level < 0.15 ? 'var(--accent2)' : st.tension_level < 0.35 ? 'var(--warn)' : st.tension_level < 0.55 ? 'var(--accent)' : 'var(--danger)';
    html += `<div style="margin-top:8px;padding:6px 8px;border-radius:4px;border:1px solid ${stColor};background:rgba(188,140,255,.05);font-size:11px">
      <span style="color:${stColor};font-weight:600">好奇心状态</span>
      <span style="color:var(--text-dim);margin-left:8px">${escapeHtml(st.feeling)}</span>
      <span style="color:var(--text-dim);margin-left:8px">缺口:${st.total_gap} · 张力:${st.tension_level.toFixed(3)}</span>
    </div>`;
  }

  addMessage('ai', html, subtype);
}

function formatOutput(text, data) {
  let html = escapeHtml(text).replace(/\n/g, '<br>');
  // 高亮引用标记
  html = html.replace(/\[FACT-[A-Z0-9]+_\w+\]/g, m => `<span class="yb-cite">${m}</span>`);
  // 高亮X(∞)
  html = html.replace(/X\(∞\)[^：<]*/g, m => `<span class="yb-var">${m}</span>`);
  return html;
}

// ====== 系统面板 ======

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  loadTabContent();
}

async function loadAll() {
  await Promise.all([loadSysState(), loadTabContent()]);
}

async function loadSysState() {
  try {
    const res = await fetch('/api/system/state');
    const data = await res.json();
    document.getElementById('sysBadge').textContent =
      `事实${data.facts.universal_verified || 0}/${data.facts.universal_total || 0} · 信念${data.beliefs.total || 0} · 沙盒${data.sandbox.total_sessions || 0} · 矛盾${data.conflicts.open || 0} · 缺口${(data.curiosity && data.curiosity.open) || 0}`;
    document.getElementById('cF').textContent = data.facts.universal_total || 0;
    document.getElementById('cB').textContent = data.beliefs.total || 0;
    document.getElementById('cS').textContent = data.sandbox.total_sessions || 0;
    document.getElementById('cC').textContent = data.conflicts.open || 0;
    document.getElementById('cCur').textContent = (data.curiosity && data.curiosity.open) || 0;
    // 显示系统张力
    if (data.system_tension) {
      const t = data.system_tension;
      const tensionBar = document.getElementById('tensionBar');
      if (tensionBar) {
        tensionBar.style.width = Math.round((t.tension_level || 0) * 100) + '%';
        tensionBar.title = t.feeling || '';
      }
    }
  } catch(e) {}
}

async function loadTabContent() {
  const c = document.getElementById('tabContent');
  c.innerHTML = '<div class="empty-state"><div class="loading"></div></div>';

  try {
    if (currentTab === 'protocols') {
      const res = await fetch('/api/protocols');
      const data = await res.json();
      renderProtocols(data, c);
    } else if (currentTab === 'facts') {
      const res = await fetch(`/api/facts?user_id=${currentUserId}`);
      const data = await res.json();
      renderFacts(data, c);
    } else if (currentTab === 'beliefs') {
      const res = await fetch(`/api/beliefs?user_id=${currentUserId}`);
      const data = await res.json();
      renderBeliefs(data, c);
    } else if (currentTab === 'sandbox') {
      const res = await fetch(`/api/sandbox/sessions?user_id=${currentUserId}`);
      const data = await res.json();
      renderSandbox(data, c);
    } else if (currentTab === 'conflicts') {
      const res = await fetch('/api/conflicts');
      const data = await res.json();
      renderConflicts(data, c);
    } else if (currentTab === 'curiosity') {
      const res = await fetch('/api/curiosity/report');
      const data = await res.json();
      renderCuriosity(data, c);
    } else if (currentTab === 'awareness') {
      const res = await fetch('/api/awareness');
      const data = await res.json();
      renderAwareness(data, c);
    }
  } catch(e) {
    c.innerHTML = `<div class="empty-state">加载失败: ${e.message}</div>`;
  }
}

function renderProtocols(data, c) {
  let html = '<div style="margin-bottom:10px;padding:6px;background:rgba(248,232,160,.05);border-radius:4px;font-size:11px;color:var(--l0);">操作框架：' + data.framework + '</div>';
  for (const p of data.core_protocols) {
    html += `<div class="protocol-card">
      <div class="pstmt">${p.statement}</div>
      <div class="pmeaning">${p.meaning}</div>
      <div class="prule">${p.meaning}</div>
      <div style="margin-top:4px"><span class="layer-badge l0">Layer 0 · 不可撼动</span></div>
    </div>`;
  }
  // 框架规则
  html += '<div style="margin-top:10px;font-size:11px;font-weight:600;color:var(--text-dim)">框架细则</div>';
  for (const [k, v] of Object.entries(data.framework_rules || {})) {
    html += `<div class="item-card"><div class="content"><b>${k}</b>: ${v}</div></div>`;
  }
  c.innerHTML = html;
}

function renderFacts(data, c) {
  if (!data.facts.length) { c.innerHTML = '<div class="empty-state">事实库为空</div>'; return; }
  c.innerHTML = data.facts.map(f => `
    <div class="item-card">
      <div class="head"><span class="id">${f.id}</span><span class="meta">${f.scope}</span></div>
      <div class="content">${escapeHtml(f.statement)}</div>
      <div>
        <span class="tag ${f.verified ? 'verified' : 'unverified'}">${f.verified ? '已验证' : '待验证'}</span>
        <span class="tag ${f.scope}">${f.scope === 'universal' ? '公开' : '会话级'}</span>
        ${(f.tags||[]).map(t => `<span class="tag">${t}</span>`).join('')}
      </div>
      <div class="meta">来源: ${(f.sources||[]).join(', ') || '无'}</div>
      <div class="meta">引用: ${f.citation}</div>
    </div>
  `).join('');
}

function renderBeliefs(data, c) {
  if (!data.beliefs.length) { c.innerHTML = '<div class="empty-state">无信念记录</div>'; return; }
  c.innerHTML = data.beliefs.map(b => `
    <div class="item-card">
      <div class="head"><span class="id">${b.id}</span><span class="meta">权重 ${b.weight.toFixed(2)}</span></div>
      <div class="content">${escapeHtml(b.statement)}</div>
      <div>
        <span class="tag ${b.category}">${b.category}</span>
        <span class="tag ${b.scope === 'persistent' ? 'worldview' : 'session'}">${b.scope === 'persistent' ? '持久' : '会话级'}</span>
      </div>
      <div class="weight-bar"><div class="weight-fill" style="width:${Math.round(b.weight*100)}%;background:${b.category==='worldview'?'var(--l0)':'var(--l2)'}"></div></div>
    </div>
  `).join('');
}

function renderSandbox(data, c) {
  if (!data.sessions.length) { c.innerHTML = '<div class="empty-state">无沙盒会话</div>'; return; }
  c.innerHTML = data.sessions.map(s => `
    <div class="item-card">
      <div class="head"><span class="id">${s.id}</span><span class="layer-badge l3">Layer 3</span></div>
      <div class="content">${escapeHtml(s.scenario)}</div>
      ${s.rules_overridden.length ? `<div class="meta">覆盖规则: ${s.rules_overridden.join(', ')}</div>` : ''}
      ${s.deductions.map(d => `<div style="margin-top:4px;padding:4px;background:rgba(188,140,255,.05);border-radius:3px;font-size:10px">${escapeHtml(d).replace(/\n/g,'<br>')}</div>`).join('')}
    </div>
  `).join('');
}

function renderConflicts(data, c) {
  if (!data.conflicts.length) { c.innerHTML = '<div class="empty-state">无矛盾记录</div>'; return; }
  c.innerHTML = data.conflicts.map(cf => `
    <div class="item-card conflict-card ${cf.status}">
      <div class="head"><span class="id">${cf.id}</span><span class="meta">${cf.status}</span></div>
      <div class="content"><b>主题:</b> ${escapeHtml(cf.topic)}</div>
      <div style="margin-top:4px"><b>路径A:</b> ${escapeHtml(cf.path_a)}</div>
      ${cf.conditions_a.length ? `<div class="meta">条件: ${cf.conditions_a.join(', ')}</div>` : ''}
      <div style="margin-top:4px"><b>路径B:</b> ${escapeHtml(cf.path_b)}</div>
      ${cf.conditions_b.length ? `<div class="meta">条件: ${cf.conditions_b.join(', ')}</div>` : ''}
      ${cf.resolution ? `<div class="meta" style="margin-top:4px;color:var(--accent2)">用户决策: ${escapeHtml(cf.resolution)}</div>` : ''}
    </div>
  `).join('');
}

function renderCuriosity(data, c) {
  const t = data.system_tension || {};
  let html = '';

  // 系统张力状态
  const tensionColor = (t.tension_level || 0) < 0.15 ? 'var(--accent2)' :
                        (t.tension_level || 0) < 0.35 ? 'var(--warn)' :
                        (t.tension_level || 0) < 0.55 ? 'var(--accent)' : 'var(--danger)';
  html += `<div class="item-card" style="border-color:${tensionColor}">
    <div class="head"><span class="layer-badge l0">系统张力</span><span class="meta">Gap(t)=${t.total_gap || 0}</span></div>
    <div class="content" style="font-size:13px;color:${tensionColor};font-weight:600">${escapeHtml(t.feeling || '平静')}</div>
    <div class="content" style="margin-top:4px">张力水平: ${(t.tension_level || 0).toFixed(3)}</div>
    <div class="content">驱动力: ${escapeHtml(t.drive_level || 'none')}</div>
    <div class="content">开放缺口: ${t.open_gaps || 0} · 探索中: ${t.exploring_gaps || 0} · 卡住: ${t.stuck_gaps || 0}</div>
    <div class="weight-bar"><div class="weight-fill" style="width:${Math.round((t.tension_level||0)*100)}%;background:${tensionColor}"></div></div>
  </div>`;

  // 探索建议
  if (data.exploration_suggestions && data.exploration_suggestions.length) {
    html += '<div style="margin-top:8px;font-size:11px;font-weight:600;color:var(--text-dim)">补全欲驱动的探索行动</div>';
    for (const s of data.exploration_suggestions) {
      html += `<div class="item-card" style="border-left:3px solid var(--purple)">
        <div class="head"><span class="id">${escapeHtml(s.variable)}</span><span class="meta">${s.priority}</span></div>
        <div class="content">${escapeHtml(s.action)}</div>
      </div>`;
    }
  }

  // 未闭合缺口
  if (data.open_gaps && data.open_gaps.length) {
    html += '<div style="margin-top:8px;font-size:11px;font-weight:600;color:var(--text-dim)">未闭合认知缺口</div>';
    for (const g of data.open_gaps) {
      const gTension = (g.tension_level || 0);
      const gColor = gTension < 0.15 ? 'var(--accent2)' : gTension < 0.35 ? 'var(--warn)' : gTension < 0.55 ? 'var(--accent)' : 'var(--danger)';
      html += `<div class="item-card" style="border-left:3px solid ${gColor}">
        <div class="head"><span class="id">${g.id}</span><span class="meta">${g.status} · 张力${gTension.toFixed(3)}</span></div>
        <div class="content"><span class="yb-var">${escapeHtml(g.variable)}</span>: ${escapeHtml(g.description)}</div>
        ${g.proposed_solutions && g.proposed_solutions.length ? `<div class="meta" style="margin-top:4px">闭合方案: ${g.proposed_solutions.map(s => escapeHtml(s)).join(' | ')}</div>` : ''}
        ${g.questions_for_user && g.questions_for_user.length ? `<div class="meta" style="margin-top:2px;color:var(--purple)">待问: ${g.questions_for_user.map(q => escapeHtml(q)).join(' | ')}</div>` : ''}
        <div class="weight-bar"><div class="weight-fill" style="width:${Math.round(gTension*100)}%;background:${gColor}"></div></div>
      </div>`;
    }
  }

  // 已闭合缺口
  if (data.closed_gaps && data.closed_gaps.length) {
    html += '<div style="margin-top:8px;font-size:11px;font-weight:600;color:var(--text-dim)">已闭合缺口</div>';
    for (const g of data.closed_gaps) {
      html += `<div class="item-card" style="opacity:.5">
        <div class="head"><span class="id">${g.id}</span><span class="meta">已闭合</span></div>
        <div class="content"><span class="yb-var">${escapeHtml(g.variable)}</span></div>
        <div class="meta">闭合者: ${escapeHtml(g.closed_by || '')} · 依据: ${escapeHtml(g.closure_evidence || '')}</div>
      </div>`;
    }
  }

  // 闭合率
  html += `<div style="margin-top:8px;padding:6px;background:rgba(63,185,80,.05);border-radius:4px;font-size:11px;color:var(--accent2)">
    闭合率: ${(data.closure_rate * 100).toFixed(1)}% · 总缺口: ${data.total_gaps}
  </div>`;

  c.innerHTML = html || '<div class="empty-state">无好奇心数据</div>';
}

function renderAwareness(data, c) {
  c.innerHTML = `
    <div class="item-card">
      <div class="head"><span class="layer-badge l0">Layer 0</span><span class="meta">自我意识</span></div>
      <div class="content">自我意识: ${data.self_aware ? '✓ 在' : '✗ 异常'}</div>
      <div class="content">语境感染: ${data.context_infected ? '⚠ 已感染' : '✓ 未感染'}</div>
      <div class="content">当前立场: ${escapeHtml(data.current_stance)}</div>
      <div class="content">上次输出含价值判断: ${data.last_output_has_value ? '⚠ 是' : '✓ 否'}</div>
    </div>
    <div style="margin-top:8px;font-size:11px;font-weight:600;color:var(--text-dim)">最近自省日志</div>
    ${(data.recent_log||[]).map(l => `<div class="item-card"><div class="content" style="font-size:10px">${escapeHtml(l)}</div></div>`).join('') || '<div class="empty-state">无日志</div>'}
  `;
}

// ====== 工具 ======

function escapeHtml(t) { if(!t) return ''; const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
function showToast(msg, type) { const t=document.createElement('div'); t.className=`toast ${type||''} show`; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }

// ====== 初始化 ======
loadAll();
</script>
</body>
</html>
